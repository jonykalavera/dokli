
##############################################################################
# MYPY SETTINGS                                                              #
##############################################################################
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = true
plugins = [
  "pydantic.mypy"
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "tests.*"
]
ignore_errors = true

##############################################################################
# RUFF SETTINGS                                                             #
##############################################################################

[tool.ruff]

# Same as Black.
line-length = 119

# Assume Python 3.10
target-version = "py310"

[tool.ruff.format]
exclude = ["__pycache__", ".pytest_cache", ".mypy_cache", ".venv",]

[tool.ruff.lint]
select = ["E", "F", "I", "PL", "B", "T20", "TCH", "ASYNC", "U", "UP", "LOG", "G", "ERA", "SIM", "D" ]

# On top of the Google convention, disable `D417`, which requires
# documentation for every function parameter.
ignore = ["D417", "PLR0913", "PLR2004", ]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

#############################################################################
# COVERAGE SETTINGS                                                          #
##############################################################################
[tool.coverage.run]
branch = true
omit = [
    "*tests.py",
    "*test_*.py",
    "*_tests.py",
]
source = [
    "dokli/"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "logger = logging.getLogger.__name__.",
    "[A-Z_][A-Z0-9_]* = .*",
    "from .* import .*",
    "import .*",
    "if __name__ == .__main__.:",
    "collections.namedtuple"
]
skip_covered = true
ignore_errors = true
show_missing = true

##############################################################################
# PROJECT SETTINGS                                                           #
##############################################################################
[project]
name = "dokli"
version = "0.1.0"
description = "Dokploy CLI and TUI"
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = { text = "MIT" }
authors = [
    { name = "Jony Kalavera", email = "mr.jony@gmail.com" },
]
dependencies = [
    "typer>=0.16.0,<0.17.0",
    "pydantic>=2.8.2,<3.0.0",
    "pydantic-settings[yaml]>=2.4.0,<3.0.0",
    "humanize>=4.10.0,<5.0.0",
    "httpx>=0.28.1,<0.29.0",
]

[project.optional-dependencies]
tui = [
    "textual>=0.75.1,<0.76.0",
]

[project.scripts]
dokli = "dokli.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.5.6,<0.6.0",
    "mypy>=1.11.1,<2.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "textual-dev>=1.5.1,<2.0.0",
    "types-tree-sitter>=0.20.1.20240311,<0.21.0",
    "types-setuptools>=71.1.0.20240726,<72.0.0",
    "types-pyyaml>=6.0.12.20240724,<7.0.0",
    "types-docutils>=0.21.0.20240724,<0.22.0",
    "tree-sitter>=0.22.3,<0.23.0",
    "types-tree-sitter-languages>=1.10.0.20240612,<2.0.0",
    "types-pygments>=2.18.0.20240506,<3.0.0",
    "datamodel-code-generator>=0.64.0,<0.65.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-randomly>=3.16.0,<4.0.0",
    "polyfactory>=2.19.0,<3.0.0",
    "pytest-blockage>=0.2.4,<0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["dokli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
